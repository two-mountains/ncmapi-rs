[package]
name = "ncmapi"
version = "1.3.0"
authors = ["akatsuki <akatsuki@gmail.com>"]
edition = "2024"
rust-version = "1.98"
description = "NetEase Cloud Music API for Rust."
license = "MIT"
homepage = "https://github.com/two-mountains/ncmapi-rs"
documentation = "https://docs.rs/ncmapi"
repository = "https://github.com/two-mountains/ncmapi-rs"
readme = "README.md"
keywords = ["netease-cloud-muisc", "api"]
categories = ["api-bindings"]

# See more keys and their definitions at https://doc.rust-lang.org/cargo/reference/manifest.html

[dependencies]
async-trait = "0.1.92"
base64 = "0.23.1"
cookie = "0.18.2"
hex = "0.4.3"
moka = { version = "0.12.16", features = ["sync"] }
openssl = "0.10.81"
rand = "0.10.2"
reqwest = { version = "0.13.4", default-features = false, features = ["cookies", "form", "json", "rustls", "socks"] }
serde = { version = "1.0.229", features = ["derive"] }
serde_json = "1.0.151"
thiserror = "2.0.20"

[dev-dependencies]
proptest = "1"
tokio = { version = "1.53.1", features = ["fs", "macros", "rt-multi-thread"] }
wiremock = "0.6"
